name: CI — EngineerPrep India

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ----------------------------------------------------------------
  # 1. Lint + Type check
  # ----------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  # ----------------------------------------------------------------
  # 2. Unit Tests
  # ----------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: test-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: test-refresh-secret-at-least-32-characters-long
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test -- --reporter=verbose
        continue-on-error: false

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ----------------------------------------------------------------
  # 3. Build
  # ----------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      # Dummy secrets for build (not used at runtime)
      JWT_ACCESS_SECRET: build-placeholder-not-used-at-runtime-xxxxxxxx
      JWT_REFRESH_SECRET: build-placeholder-not-used-at-runtime-yyyyyyyy
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 1

  # ----------------------------------------------------------------
  # 4. Docker Build Verification
  # ----------------------------------------------------------------
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (verify only)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: engineerprep-india:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # ----------------------------------------------------------------
  # 5. Security Audit
  # ----------------------------------------------------------------
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Audit for vulnerabilities
        run: npm audit --audit-level=high
        continue-on-error: true  # Report but don't block (some are in devDeps)

  # ----------------------------------------------------------------
  # 6. Deploy (main branch only)
  # ----------------------------------------------------------------
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Deploy notification
        run: |
          echo "Deployment to production triggered."
          echo "Configure deployment steps for your hosting provider here."
          echo "Common options:"
          echo "  - SSH deploy to VPS: appleboy/ssh-action"
          echo "  - Push to container registry: docker/login-action + docker push"
          echo "  - Trigger webhook: curl to deployment endpoint"
          echo ""
          echo "See docs/DEPLOYMENT.md for detailed instructions."

