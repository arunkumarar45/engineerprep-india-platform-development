version: "3.9"

# Production overrides — extend docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    # No ports exposed externally — accessed via internal network only
    ports: !reset []

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m
    ports: !reset []

  frontend:
    restart: unless-stopped
    environment:
      NODE_ENV: production
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required in production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required in production}
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
      replicas: 1
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

