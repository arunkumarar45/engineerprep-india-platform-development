name = "engineerprep-india"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

[vars]
NPM_FLAGS = "--legacy-peer-deps"
CF_PAGES = "1"
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
COOKIE_SECURE = "true"
COOKIE_SAMESITE = "lax"
BCRYPT_ROUNDS = "12"
RATE_LIMIT_MAX_REQUESTS = "100"
STORAGE_PROVIDER = "local"
JWT_ACCESS_EXPIRES_IN = "15m"
JWT_REFRESH_EXPIRES_IN = "7d"
FRONTEND_URL = "https://engineerprep-india.pages.dev"
NEXT_PUBLIC_API_URL = "https://engineerprep-india.pages.dev"
GOOGLE_CALLBACK_URL = "https://engineerprep-india.pages.dev/api/v1/auth/google/callback"
INITIAL_ADMIN_EMAIL = "admin@engineerprep.in"
INITIAL_ADMIN_PASSWORD = "Admin@SecurePassword123!"
NEXT_PUBLIC_APP_NAME = "EngineerPrep India"
